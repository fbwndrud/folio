name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.13.0' }
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '24' }
          - { os: windows-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci
      - run: npm --prefix viewer ci
      - run: npm --prefix viewer test
      - run: npm --prefix viewer run build
      - name: Lint, typecheck and regression tests
        run: npm run check
      - name: Verify synthetic prose and dynamic tracking over MCP
        run: npm run examples:verify
      - name: Verify provider-neutral synthetic asset handoff over MCP
        run: npm run assets:verify
      - name: Verify writing and resource-only stdio, HTTP and exports
        run: npm run production:verify
      - name: Install packed artifact and verify prose, assets, tracking and viewer flows
        run: npm run package:verify
